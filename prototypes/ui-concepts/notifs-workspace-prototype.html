@media(max-width:550px){#notifs-next .nx-shell{grid-template-columns:1fr}#notifs-next .nx-sidebar{padding:20px 15px;border-right:0;border-bottom:1px solid var(--nx-line);gap:18px}#notifs-next .nx-nav{grid-template-columns:1fr 1fr}#notifs-next .nx-navbutton.nx-new{grid-column:1/-1;margin:0}#notifs-next .nx-tagline,#notifs-next .nx-profile{display:none}#notifs-next .nx-sidebarbottom{margin-top:0}#notifs-next .nx-sidebarbottom .nx-navbutton{min-height:44px}#notifs-next .nx-main{padding:24px 15px}#notifs-next .nx-app h1{font-size:26px}#notifs-next .nx-app h2{font-size:21px}#notifs-next .nx-formrow{grid-template-columns:1fr;gap:0}#notifs-next .nx-head{flex-wrap:wrap}#notifs-next .nx-weekhead{flex-wrap:wrap}#notifs-next .nx-weekday{min-height:62px;padding:7px 0;font-size:9px}#notifs-next .nx-weekday strong{font-size:18px}#notifs-next .nx-week{gap:4px}#notifs-next .nx-monthgrid{gap:3px}#notifs-next .nx-day{min-height:84px;padding:6px 2px}#notifs-next .nx-daynumber{font-size:11px;width:22px;height:22px;align-self:center}#notifs-next .nx-daytask{justify-content:center}#notifs-next .nx-more{font-size:9px;text-align:center}#notifs-next .nx-monthhead{flex-wrap:wrap}#notifs-next .nx-rangefields .nx-button{width:100%}#notifs-next .nx-dialog{padding:18px;max-height:560px}#notifs-next .nx-dialoghead{gap:8px}#notifs-next .nx-checkin{right:12px;bottom:16px}#notifs-next .nx-reminder{flex-wrap:wrap}}
@media(pointer:coarse){#notifs-next .nx-check{width:36px;height:36px;left:12px;top:16px}#notifs-next .nx-cardhit{padding-left:60px}#notifs-next .nx-filter{min-height:44px}#notifs-next .nx-iconbutton{width:44px;height:44px}}
@media(prefers-reduced-motion:reduce){#notifs-next .nx-app *{transition:none!important;animation:none!important}}
</style>
<script>
(() => {
 const root=document.getElementById('notifs-next'),app=root.querySelector('.nx-app'),main=root.querySelector('.nx-main'),sidebar=root.querySelector('.nx-sidebar'),dialog=root.querySelector('.nx-dialog'),checkin=root.querySelector('.nx-checkin');
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
 const dayMs=86400000;
 const stamp=value=>Date.parse(value.length===10?value+'T12:00:00Z':value+'Z');
 const key=value=>new Date(value).toISOString().slice(0,10);
 const day=value=>key(typeof value==='string'?stamp(value):value);
 const addDay=(d,n)=>key(stamp(d)+n*dayMs);
 const format=(d,options)=>new Intl.DateTimeFormat('ru-RU',{timeZone:'UTC',...options}).format(new Date(typeof d==='string'?stamp(d):d));
 const dateLabel=d=>format(d,{day:'numeric',month:'long'});
 const timeLabel=d=>format(d,{hour:'2-digit',minute:'2-digit'});
 const startWeek=d=>{const n=new Date(stamp(d)).getUTCDay();return addDay(d,-((n+6)%7));};
 const duration=n=>{if(!n)return 'Без оценки';const h=Math.floor(n/60),m=n%60;return [h?h+' ч':'',m?m+' мин':''].filter(Boolean).join(' ');};
 const initialNow=Date.UTC(2026,10,18,12),realStart=Date.now();
 const tasks=[
  {id:1,title:'Закончить практическую работу',rank:'S',created:'2026-11-16T15:00:00',deadline:'2026-11-18T20:00:00',estimate:420,description:'## Остался последний шаг\n\n- Проверить расчёты\n- Оформить выводы\n- Отправить преподавателю',done:false},
  {id:2,title:'Отправить домашнюю работу',rank:'A',created:'2026-11-17T10:00:00',deadline:'2026-11-18T14:00:00',estimate:40,description:'Проверить вложения, прикрепить файл и отправить работу в личном кабинете.',done:false},
  {id:3,title:'Пройти курс по C#',rank:'B',created:'2026-11-10T12:00:00',deadline:'2026-12-18T18:00:00',estimate:1200,description:'## Следующая тема\n\n- Асинхронность\n- Практическое задание',done:false},
  {id:4,title:'Навести порядок на рабочем столе',rank:'C',created:'2026-11-14T12:00:00',deadline:'',estimate:4320,description:'Разобрать файлы и конспекты. Расчётный промежуток: с субботы 14 ноября по вторник 17 ноября.',done:false},
  {id:5,title:'Помыть пол',rank:'D',created:'2026-11-18T08:00:00',deadline:'',estimate:45,description:'Прибраться в комнате, затем помыть пол на кухне.',done:false},
  {id:6,title:'Записаться на следующую неделю',rank:'B',created:'2026-11-16T10:00:00',deadline:'2026-11-17T18:00:00',estimate:15,description:'Выбрать удобное время и добавить запись в календарь.',done:true},
  {id:7,title:'Сдать отчёт по проекту',rank:'A',created:'2026-11-18T09:00:00',deadline:'2026-11-24T16:00:00',estimate:240,description:'Собрать результаты и отправить итоговый отчёт.',done:false}
 ];
 const state={page:'tasks',selected:1,filter:'all',sticky:new Set(),tasks,week:'2026-11-16',period:{from:'2026-11-18',to:'2026-11-18'},month:10,year:2026,range:{from:'2026-11-18',to:'2026-11-18'},anchor:null,keyboardRange:false,drag:null,notice:'',now:initialNow,offset:0,sessions:{},notification:null,edit:null,preview:false,error:false,draft:{title:'',description:'',date:'',time:'',estimate:'',rank:'B'}};
 const getTask=id=>state.tasks.find(t=>t.id===Number(id));
 const deleteDialog=root.querySelector('.nx-delete-dialog');
 let pendingDeleteId=null,removedTask=null,nextTaskId=Math.max(...tasks.map(t=>t.id))+1;
 const rank=t=>`<span class="nx-rank" data-rank="${esc(t.rank)}" aria-label="Ранг ${esc(t.rank)}">${esc(t.rank)}</span>`;
 const estimated=t=>!t.deadline&&t.estimate?stamp(t.created)+t.estimate*60000:null;
 function reasons(t,p){const result=[];const has=v=>v&&day(v)>=p.from&&day(v)<=p.to;if(has(t.created))result.push('Создана');if(has(t.deadline))result.push('Дедлайн');if(has(estimated(t)))result.push('Расчётное завершение');const session=state.sessions[t.id];if(session?.due&&has(session.due))result.push('Оценка от начала');return result;}
 function periodTasks(p){return state.tasks.filter(t=>reasons(t,p).length);}
 function dueLabel(t){return t.deadline?(day(t.deadline)==='2026-11-18'?'Сегодня':dateLabel(t.deadline))+', '+timeLabel(t.deadline):'Без дедлайна';}
 function age(t){const n=Math.max(0,Math.floor((state.now-stamp(t.created))/dayMs));return n===0?'Создана сегодня':n===1?'Создана вчера':'Создана '+n+' дн. назад';}
 function markdown(text){const inline=line=>esc(line).replace(/\*\*\*([^\n]+?)\*\*\*/g,'<strong><em>$1</em></strong>').replace(/\*\*([^\n]+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,'$1<em>$2</em>');return text.split('\n').map(line=>line.startsWith('## ')?'<h3>'+inline(line.slice(3))+'</h3>':line.startsWith('# ')?'<h3>'+inline(line.slice(2))+'</h3>':line.startsWith('- ')?'<div>• '+inline(line.slice(2))+'</div>':'<p>'+(inline(line)||'<br>')+'</p>').join('');}
 function refreshIcons(){globalThis.lucide?.createIcons({attrs:{width:18,height:18,'stroke-width':1.7}});}
 function spanLabel(p){return p.from===p.to?dateLabel(p.from):dateLabel(p.from)+' — '+dateLabel(p.to);}
 function card(t,{period=null}={}){const session=state.sessions[t.id];return `<article class="nx-task ${state.selected===t.id?'nx-selected':''} ${t.done?'nx-completed':''}" data-task="${t.id}"><button type="button" class="nx-cardhit" data-action="select" data-id="${t.id}" aria-label="Открыть задачу: ${esc(t.title)}" aria-pressed="${state.selected===t.id}"><span class="nx-tasktitle">${esc(t.title)}</span><span class="nx-meta">${rank(t)}<span>${esc(dueLabel(t))}</span><span>·</span><span>${duration(t.estimate)}</span></span>${t.done?`<span class="nx-taskstate">${icon('check')}Выполнена</span>`:session?`<span class="nx-taskstate">${icon(session.pausedAt?'pause':'play')}${session.pausedAt?'На паузе · с '+timeLabel(session.pausedAt):'В процессе · с '+timeLabel(session.start)}</span>`:''}${period?`<span class="nx-reasons">${reasons(t,period).map(r=>'<span class="nx-reason">'+r+'</span>').join('')}</span>`:''}</button><button type="button" class="nx-check" data-action="complete" data-id="${t.id}" aria-label="${t.done?'Вернуть в работу':'Выполнить'}: ${esc(t.title)}" aria-pressed="${t.done}">${t.done?icon('check'):''}</button></article>`;}
 function activeElapsed(s){return s.activeMs+(s.activeSince===null?0:Math.max(0,state.now-s.activeSince));}
 function sessionText(id){const s=state.sessions[id];if(!s)return '';const remaining=s.pausedAt?s.remainingMs:s.due===null?null:s.due-state.now;if(remaining===null)return s.pausedAt?'На паузе · без оценки':'Без напоминания по времени';if(remaining<=0)return s.pausedAt?'На паузе · оценка уже прошла':'Время оценки прошло';return (s.pausedAt?'На паузе · осталось ':'До вопроса: ')+duration(Math.ceil(remaining/60000));}
 function sessionPanel(t,s){return `<div class="nx-session">Начал ${dateLabel(s.start)}, ${timeLabel(s.start)}<strong data-session="${t.id}">${sessionText(t.id)}</strong>${s.pausedAt?'Пауза с '+dateLabel(s.pausedAt)+', '+timeLabel(s.pausedAt)+'. Отсчёт заморожен.':s.due?'Вопрос о результате в '+timeLabel(s.due):'Можно добавить оценку в редакторе.'}<p style="margin-top:8px">Активное время: <span data-active-time="${t.id}">${duration(Math.floor(activeElapsed(s)/60000))==='Без оценки'?'меньше минуты':duration(Math.floor(activeElapsed(s)/60000))}</span></p></div>`;}
 function details(t){
  if(!t)return `<div class="nx-empty"><h2>Выберите задачу</h2><p>Подробности, описание и действия появятся здесь.</p></div>`;
  const s=state.sessions[t.id];
  const sessionActions=!t.done?(s?`<button type="button" class="nx-button ${s.pausedAt?'nx-primary':''}" data-action="${s.pausedAt?'resume':'pause'}" data-id="${t.id}">${icon(s.pausedAt?'play':'pause')}${s.pausedAt?'Продолжить':'Сделать паузу'}</button><button type="button" class="nx-button" data-action="cancel-session" data-id="${t.id}" aria-label="Отменить начало занятия" data-tooltip="Отменить начало занятия. Задача останется в списке.">${icon('x')}Отменить</button>`:`<button type="button" class="nx-button nx-primary" data-action="start" data-id="${t.id}">${icon('play')}Сел делать</button>`):'';
  return `<section class="nx-detail ${t.done?'nx-completed':''}"><div class="nx-detailtag"><span>${t.done?'ВЫПОЛНЕНА':s?.pausedAt?'НА ПАУЗЕ':s?'В ПРОЦЕССЕ':'ПОДРОБНОСТИ ЗАДАЧИ'}</span>${rank(t)}</div><h2>${esc(t.title)}</h2><p class="nx-small nx-muted">${age(t)}</p><dl class="nx-facts"><div><dt>Дедлайн</dt><dd>${esc(dueLabel(t))}</dd></div><div><dt>Полная оценка</dt><dd>${duration(t.estimate)}</dd></div><div><dt>Создание</dt><dd>${dateLabel(t.created)}, ${timeLabel(t.created)}</dd></div><div><dt>${t.deadline?'Запас времени':'Расчётное завершение'}</dt><dd>${t.deadline?duration(Math.max(0,Math.round((stamp(t.deadline)-state.now)/60000)-t.estimate)):estimated(t)?dateLabel(estimated(t))+', '+timeLabel(estimated(t)):'Не задано'}</dd></div></dl><div class="nx-description">${markdown(t.description)}</div>${s?sessionPanel(t,s):''}<div class="nx-actions">${sessionActions}<button type="button" class="nx-button ${s&&!s.pausedAt&&!t.done?'nx-primary':''}" data-action="complete" data-id="${t.id}">${icon(t.done?'rotate-ccw':'check')}${t.done?'В работу':'Готово'}</button><button type="button" class="nx-button" data-action="edit" data-id="${t.id}">${icon('pencil')}Изменить</button></div></section>`;
 }
 function baseItems(){if(state.page==='progress')return state.tasks.filter(t=>state.sessions[t.id]||state.sticky.has(t.id));if(state.page==='history')return state.tasks.filter(t=>t.done||state.sticky.has(t.id));if(state.page==='week')return periodTasks(state.period);return state.tasks;}
 function filterItems(items){return items.filter(t=>state.filter==='all'||state.sticky.has(t.id)||(state.filter==='done'?t.done:!t.done));}
 function filterBar(items){const options=[['all','Все',items.length],['open','Не сделаны',items.filter(t=>!t.done).length],['done','Сделаны',items.filter(t=>t.done).length]];return `<div class="nx-filters" role="group" aria-label="Показывать задачи">${options.map(([k,label,n])=>`<button type="button" class="nx-filter" data-action="filter" data-filter="${k}" aria-pressed="${state.filter===k}">${label} ${n}</button>`).join('')}</div>`;}
 function header(title,subtitle){return `<header class="nx-head"><div><div class="nx-overline">Среда, 18 ноября</div><h1>${title}</h1><p class="nx-subtitle">${subtitle}</p></div><span class="nx-clock">${icon('clock-3')}<span data-clock>${timeLabel(state.now)}</span></span></header>`;}
 function weekStrip(){return `<div class="nx-weekhead"><div class="nx-weekcontrols"><button type="button" class="nx-iconbutton" data-action="week-prev" aria-label="Предыдущая неделя">${icon('chevron-left')}</button><button type="button" class="nx-iconbutton" data-action="week-next" aria-label="Следующая неделя">${icon('chevron-right')}</button></div><span class="nx-small nx-muted">${spanLabel({from:state.week,to:addDay(state.week,6)})}</span><button type="button" class="nx-button" data-action="month">${icon('calendar-days')}Открыть календарь</button></div><div class="nx-week">${['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'].map((name,i)=>{const d=addDay(state.week,i);return `<button type="button" class="nx-weekday" data-action="week-day" data-date="${d}" aria-pressed="${d>=state.period.from&&d<=state.period.to}" aria-label="${dateLabel(d)}">${name}<strong>${Number(d.slice(-2))}</strong></button>`;}).join('')}</div><div class="nx-periodlabel"><span>${spanLabel(state.period)}</span><button type="button" class="nx-button" data-action="whole-week">${icon('arrow-right')}Вся неделя</button></div>`;}
 function listView(){const base=baseItems(),items=filterItems(base);let t=items.find(x=>x.id===state.selected);if(!t){t=items[0];state.selected=t?.id??null;}const head=state.page==='progress'?header('В процессе','Когда начал и когда пора проверить результат.'):state.page==='history'?header('История','Завершённые дела и возможность вернуться к ним.'):state.page==='week'?header('Календарь','Неделя рядом с задачами. Полный месяц — в один клик.'):header('Мои задачи','Список слева. Внимание — на одном деле.');return head+(state.page==='week'?weekStrip():'')+`<div class="nx-split"><section><div class="nx-sectionlabel"><span>${state.page==='progress'?'НАЧАТЫЕ ЗАДАЧИ':'ЗАДАЧИ'}</span><span>${items.length}</span></div><div class="nx-queue">${items.map(t=>card(t,{period:state.page==='week'?state.period:null})).join('')||`<div class="nx-empty"><h2>${state.page==='progress'?'Пока ничего не начато':'Здесь пока пусто'}</h2><p>${state.page==='progress'?'Откройте задачу и нажмите «Сел делать».':'Выберите другой фильтр или добавьте задачу.'}</p></div>`}</div>${filterBar(base)}</section><div>${details(t)}</div></div>`;}
 function monthGrid(){const first=key(Date.UTC(state.year,state.month,1,12)),begin=startWeek(first);const days=Array.from({length:42},(_,i)=>addDay(begin,i));return `<div class="nx-weeknames">${['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'].map(n=>'<span>'+n+'</span>').join('')}</div><div class="nx-monthgrid" role="group" aria-label="Дни месяца, доступно выделение периода">${days.map(d=>{const items=periodTasks({from:d,to:d});return `<button type="button" class="nx-day ${Number(d.slice(5,7))-1!==state.month?'nx-outside':''} ${d==='2026-11-18'?'nx-today':''} ${d>=state.range.from&&d<=state.range.to?'nx-inrange':''}" data-action="month-day" data-date="${d}" aria-pressed="${d>=state.range.from&&d<=state.range.to}" aria-label="${dateLabel(d)}. Задач: ${items.length}${items.length?'. '+items.map(t=>t.rank+': '+t.title).join('; '):''}"><span class="nx-daynumber">${Number(d.slice(-2))}</span>${items.slice(0,3).map(t=>`<span class="nx-daytask ${t.done?'nx-done':''}" data-tooltip="${esc(t.rank+' — '+t.title)}">${rank(t)}<span class="nx-daytasktitle">${esc(t.title)}</span></span>`).join('')}${items.length>3?'<span class="nx-more">Ещё '+(items.length-3)+'</span>':''}</button>`;}).join('')}</div>`;}
 function monthView(){return header('Календарь целиком','Выберите день или протяните выделение через нужные даты.')+`<div class="nx-monthhead"><div class="nx-weekcontrols"><button type="button" class="nx-iconbutton" data-action="month-prev" aria-label="Предыдущий месяц">${icon('chevron-left')}</button><button type="button" class="nx-iconbutton" data-action="month-next" aria-label="Следующий месяц">${icon('chevron-right')}</button></div><h2 class="nx-monthtitle">${format(Date.UTC(state.year,state.month,1),{month:'long',year:'numeric'})}</h2><button type="button" class="nx-button" data-action="back-week">${icon('arrow-left')}К неделе</button></div><div class="nx-rangefields"><label>Начало периода<input type="date" name="range-from" value="${state.range.from}" aria-label="Начало выбранного периода"></label><label>Конец периода<input type="date" name="range-to" value="${state.range.to}" aria-label="Конец выбранного периода"></label><button type="button" class="nx-button" data-action="range-apply">Показать период</button></div>${monthGrid()}<p class="nx-draglabel" data-range-label>${spanLabel(state.range)}</p>`;}
 function editorView(){const d=state.draft;return header(state.edit?'Изменить задачу':'Новое дело','Все детали остаются в этом окне.')+`<div class="nx-form"><label class="nx-field">Название задачи *<input name="title" value="${esc(d.title)}" aria-required="true" ${state.error?'aria-invalid="true" aria-describedby="nx-form-error"':''} placeholder="Что нужно сделать?">${state.error?'<span class="nx-error" id="nx-form-error" role="alert">Введите название. Остальной текст останется на месте.</span>':''}</label><div class="nx-formrow"><label class="nx-field">Дедлайн<input name="date" type="date" value="${d.date}"></label><label class="nx-field">Время дедлайна<input name="time" type="time" value="${d.time}"></label></div><div class="nx-formrow"><label class="nx-field">Оценка, минуты<input name="estimate" type="number" min="1" value="${esc(d.estimate)}" placeholder="Например, 90"></label><label class="nx-field">Ранг важности<select name="rank">${['S','A','B','C','D'].map(r=>`<option ${r===d.rank?'selected':''}>${r}</option>`).join('')}</select></label></div><div class="nx-formtabs"><button type="button" class="nx-formtab" data-action="source" aria-pressed="${!state.preview}">Описание · Markdown</button><button type="button" class="nx-formtab" data-action="preview" aria-pressed="${state.preview}">Просмотр</button></div>${state.preview?`<div class="nx-preview nx-description">${markdown(d.description||'Подробности задачи появятся здесь.')}</div>`:`<label class="nx-field">Заметки и подробности<textarea name="description" placeholder="Списки, пояснения, важные детали">${esc(d.description)}</textarea></label>`}<div class="nx-actions"><button type="button" class="nx-button nx-primary" data-action="save">${icon('check')}Сохранить задачу</button><button type="button" class="nx-button" data-action="nav" data-page="tasks">К задачам</button></div></div>`;}
 function extraView(){if(state.page==='reminders')return header('Напоминания','Сигналы, которые помогают возвращаться к делам.')+`<article class="nx-reminder"><div><h3>Размяться и отдохнуть от экрана</h3><p>Простой сигнал · каждый час, в :00</p></div><button type="button" class="nx-button" data-action="toggle-reminder" aria-pressed="true">Включено</button></article><article class="nx-reminder"><div><h3>Сменить постельное бельё</h3><p>Через две недели после выполнения</p></div><button type="button" class="nx-button" data-action="linen">Готово</button></article>`;return header('Настройки','Всё важное для спокойной работы.')+`<div class="nx-form"><label class="nx-field">Монитор для уведомлений<select><option>Автоматический выбор</option><option>Основной монитор</option><option>Дополнительный монитор</option></select></label><label class="nx-reminder"><span><strong>Запускать вместе с Windows</strong><p>Возвращаться к делам после включения компьютера.</p></span><input type="checkbox" checked aria-label="Запускать вместе с Windows"></label><label class="nx-reminder"><span><strong>Периодическая сводка</strong><p>Напоминать о задачах каждые три часа.</p></span><input type="checkbox" checked aria-label="Периодическая сводка"></label></div>`;}

 function askDelete(t){pendingDeleteId=t.id;deleteDialog.innerHTML=`<h2 id="nx-delete-title">Удалить задачу?</h2><p id="nx-delete-description">«${esc(t.title)}» исчезнет из списка и календаря. Удаление можно будет отменить кнопкой «Восстановить».</p>${state.sessions[t.id]?'<p style="margin-top:10px">Занятие и его напоминание будут остановлены.</p>':''}<div class="nx-actions"><button type="button" class="nx-button" data-action="keep-task" autofocus>Оставить</button><button type="button" class="nx-button nx-danger" data-action="confirm-delete">${icon('trash-2')}Удалить</button></div>`;deleteDialog.showModal();const box=app.getBoundingClientRect();deleteDialog.style.top=Math.max(24,box.top+(box.height-deleteDialog.getBoundingClientRect().height)/2)+'px';refreshIcons();}
 function deleteTask(){const t=getTask(pendingDeleteId);if(!t)return;const index=state.tasks.indexOf(t),s=state.sessions[t.id];removedTask={task:{...t},index,session:s?{...s,activeMs:activeElapsed(s),activeSince:null,pausedAt:s.pausedAt||state.now,remainingMs:s.pausedAt?s.remainingMs:s.due===null?null:Math.max(0,s.due-state.now),due:null,notified:false}:null};state.tasks.splice(index,1);delete state.sessions[t.id];state.sticky.delete(t.id);if(state.notification===t.id)state.notification=null;if(state.selected===t.id)state.selected=state.tasks[index]?.id??state.tasks[index-1]?.id??null;deleteDialog.close();pendingDeleteId=null;state.notice='Задача «'+t.title+'» удалена.';render();(main.querySelector('.nx-selected .nx-cardhit')||sidebar.querySelector('[data-page="new"]'))?.focus({preventScroll:true});}
 function undoDelete(){if(!removedTask)return;const saved=removedTask;state.tasks.splice(Math.min(saved.index,state.tasks.length),0,saved.task);if(saved.session)state.sessions[saved.task.id]=saved.session;state.selected=saved.task.id;state.page='tasks';state.filter='all';removedTask=null;state.notice=saved.session?'Задача восстановлена. Занятие возвращено на паузе.':'Задача восстановлена.';render();main.querySelector('.nx-selected .nx-cardhit')?.focus({preventScroll:true});}
 function openRange(from,to){state.range={from:from<to?from:to,to:from<to?to:from};paintRange();renderDialog();dialog.showModal();const box=app.getBoundingClientRect();dialog.style.top=Math.max(24,box.top+(box.height-dialog.getBoundingClientRect().height)/2)+'px';refreshIcons();}
 function renderDialog(){const items=periodTasks(state.range);dialog.innerHTML=`<div class="nx-dialoghead"><div><p class="nx-overline">${state.range.from===state.range.to?'ЗАДАЧИ НА ДЕНЬ':'ВЫБРАННЫЙ ПЕРИОД'}</p><h2 id="nx-dialog-title">${spanLabel(state.range)}</h2><p class="nx-subtitle">Задач: ${items.length} · каждая показана один раз</p></div><button type="button" class="nx-iconbutton" data-action="close-dialog" aria-label="Закрыть задачи периода" autofocus>${icon('x')}</button></div><div class="nx-queue">${items.map(t=>card(t,{period:state.range})).join('')||'<p class="nx-muted nx-small">В этом периоде задач нет.</p>'}</div><div class="nx-actions"><button type="button" class="nx-button nx-primary" data-action="go-period">${icon('arrow-right')}${state.range.from===state.range.to?'Перейти к этому дню':'Перейти к этому периоду'}</button></div>`;refreshIcons();}
 function paintRange(){const from=state.range.from,to=state.range.to;main.querySelectorAll('.nx-day').forEach(b=>{const active=b.dataset.date>=from&&b.dataset.date<=to;b.classList.toggle('nx-inrange',active);b.setAttribute('aria-pressed',String(active));});const label=main.querySelector('[data-range-label]');if(label)label.textContent=spanLabel(state.range);const fromField=main.querySelector('[name="range-from"]'),toField=main.querySelector('[name="range-to"]');if(fromField)fromField.value=from;if(toField)toField.value=to;}
 function paintNotification(){if(!state.notification){checkin.hidden=true;return;}const t=getTask(state.notification),s=state.sessions[t?.id];if(!t||!s||t.done||s.pausedAt){state.notification=null;checkin.hidden=true;return;}checkin.innerHTML=`<div class="nx-checkinhead"><span>NOTIFS · ВРЕМЯ ПРОВЕРИТЬ</span><button type="button" class="nx-iconbutton" data-action="dismiss-checkin" aria-label="Закрыть напоминание">${icon('x')}</button></div><h3>Сделал задачу?</h3><p>${esc(t.title)}</p><p style="margin-top:10px">Активное время — ${duration(Math.floor(activeElapsed(s)/60000))}, без пауз. Оценка — ${duration(t.estimate)}.</p><div class="nx-actions"><button type="button" class="nx-button nx-primary" data-action="complete" data-id="${t.id}">${icon('check')}Готово</button><button type="button" class="nx-button" data-action="extend" data-id="${t.id}">Ещё 15 минут</button></div>`;checkin.hidden=false;checkin.setAttribute('role','status');refreshIcons();}
 function updateTimerLabels(){root.querySelectorAll('[data-session]').forEach(e=>e.textContent=sessionText(Number(e.dataset.session)));root.querySelectorAll('[data-active-time]').forEach(e=>{const s=state.sessions[Number(e.dataset.activeTime)],minutes=s?Math.floor(activeElapsed(s)/60000):0;e.textContent=minutes?duration(minutes):'меньше минуты';});root.querySelectorAll('[data-clock]').forEach(e=>e.textContent=timeLabel(state.now));root.querySelector('[data-demo="advance"]').disabled=!Object.values(state.sessions).some(s=>s.due&&!s.pausedAt);}
 function updateTime(){state.now=initialNow+(Date.now()-realStart)+state.offset;for(const [id,s] of Object.entries(state.sessions)){if(s.due&&state.now>=s.due&&!s.notified&&!getTask(id)?.done){s.notified=true;state.notification=Number(id);paintNotification();break;}}updateTimerLabels();}
 function saveDraft(){main.querySelectorAll('[name]').forEach(el=>{if(Object.hasOwn(state.draft,el.name))state.draft[el.name]=el.value;});}
 function formatSelection(marker){const field=main.querySelector('textarea[name="description"]');if(!field)return;const start=field.selectionStart,end=field.selectionEnd,text=field.value.slice(start,end);field.setRangeText(marker+text+marker,start,end,'select');field.focus({preventScroll:true});field.setSelectionRange(start+marker.length,end+marker.length);field.dispatchEvent(new Event('input',{bubbles:true}));}
 function saveTask(){saveDraft();if(!state.draft.title.trim()){state.error=true;render();main.querySelector('[name="title"]').focus({preventScroll:true});return;}const d=state.draft,original=getTask(state.edit),id=original?.id??nextTaskId++;const data={id,title:d.title.trim(),description:d.description,rank:d.rank,created:original?.created??new Date(state.now).toISOString().slice(0,19),deadline:d.date?d.date+'T'+(d.time||'23:59')+':00':'',estimate:Number(d.estimate)>0?Number(d.estimate):0,done:original?.done??false};if(original)Object.assign(original,data);else state.tasks.push(data);state.page='tasks';state.selected=id;state.filter='all';state.edit=null;state.error=false;state.notice='Задача сохранена.';state.draft={title:'',description:'',date:'',time:'',estimate:'',rank:'B'};render();}
 root.addEventListener('input',()=>{if(state.page==='new')saveDraft();});
 root.addEventListener('click',event=>{
  const b=event.target.closest('button');if(!b||!root.contains(b))return;
  if(b.dataset.demo==='advance'){const due=Math.min(...Object.values(state.sessions).filter(s=>s.due).map(s=>s.due));if(Number.isFinite(due)){state.offset+=Math.max(0,due-state.now)+1000;updateTime();}return;}
  if(b.dataset.demo==='skip'){state.offset+=15*60000;updateTime();return;}
  const a=b.dataset.action,t=getTask(b.dataset.id);if(!a)return;if(state.page==='new')saveDraft();state.notice='';
  if(a==='delete-task'&&t){askDelete(t);return;}
  if(a==='keep-task'){pendingDeleteId=null;deleteDialog.close();return;}
  if(a==='confirm-delete'){deleteTask();return;}

  if(a==='nav'){state.page=b.dataset.page;state.sticky.clear();state.filter=state.page==='history'?'done':'all';if(state.page==='new'&&state.edit){state.edit=null;state.draft={title:'',description:'',date:'',time:'',estimate:'',rank:'B'};}state.error=false;}

  else if(a==='extend'&&t){const s=state.sessions[t.id];if(s){s.due=state.now+15*60000;s.notified=false;}state.notification=null;state.notice='Спросим ещё раз через 15 минут. Исходная оценка не изменилась.';}

  else if(a==='month'){state.page='month';const d=new Date(stamp(state.period.from));state.month=d.getUTCMonth();state.year=d.getUTCFullYear();state.range={...state.period};}
