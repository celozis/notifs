    {id:3,title:'Пройти курс по C#',rank:'B',due:'18 декабря',estimate:'20 часов',age:'Создана 5 дней назад',day:20,slack:'29 дней',description:'## Следующая тема\n\n- Асинхронность\n- Практическое задание',done:false},
    {id:4,title:'Забрать заказ',rank:'C',due:'Без дедлайна',estimate:'Без оценки',age:'Создана 3 дня назад',day:19,slack:'—',description:'Пункт выдачи рядом с домом. Взять с собой пакет.',done:false},
    {id:5,title:'Обновить список покупок',rank:'D',due:'Без дедлайна',estimate:'15 минут',age:'Создана вчера',day:18,slack:'—',description:'Паста, томаты, базилик. Проверить, что уже есть дома.',done:false}
  ];
  const states=new Map();
  function refreshIcons(){if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:18,height:18,'stroke-width':1.65}});}
  function rank(t){return `<span class="nf-rank" data-rank="${esc(t.rank)}" aria-label="Ранг ${esc(t.rank)}">${esc(t.rank)}</span>`;}
  function meta(t){return `<div class="nf-meta">${rank(t)}<span>${esc(t.due)}</span><span class="nf-separator">·</span><span>${esc(t.estimate)}</span></div>`;}
  function check(t){return `<button type="button" class="nf-check" data-action="complete" data-id="${t.id}" aria-label="${t.done?'Вернуть в работу':'Выполнить'}: ${esc(t.title)}">${t.done?icon('check',15):''}</button>`;}
  function taskCard(t,state){return `<article class="nf-task ${state.selected===t.id?'nf-selected':''}"><div class="nf-tasktop">${check(t)}<div><button type="button" class="nf-taskname" data-action="select" data-id="${t.id}">${esc(t.title)}</button>${meta(t)}</div></div></article>`;}
  function detail(t){if(!t)return `<section class="nf-detail"><h2>Планы на своём месте</h2><p class="nf-detailtext">Выберите задачу из списка.</p></section>`;return `<section class="nf-detail"><span class="nf-tag">${icon('file-text',13)} ПОДРОБНОСТИ</span><h2>${esc(t.title)}</h2><p class="nf-small nf-muted">${esc(t.age)}</p><dl class="nf-facts"><div><dt>Дедлайн</dt><dd>${esc(t.due)}</dd></div><div><dt>Оценка</dt><dd>${esc(t.estimate)}</dd></div><div><dt>Запас времени</dt><dd>${esc(t.slack)}</dd></div><div><dt>Важность</dt><dd>Ранг ${esc(t.rank)}</dd></div></dl><div class="nf-small nf-muted">${markdown(t.description)}</div><div class="nf-actions"><button type="button" class="nf-action nf-primary" data-action="complete" data-id="${t.id}">${icon(t.done?'rotate-ccw':'check',16)}${t.done?'В работу':'Готово'}</button><button type="button" class="nf-action" data-action="edit" data-id="${t.id}">${icon('pencil',15)}Изменить</button></div></section>`;}
  function markdown(text){return esc(text).split('\n').map(line=>line.startsWith('## ')?`<h3>${line.slice(3)}</h3>`:line.startsWith('# ')?`<h2>${line.slice(2)}</h2>`:line.startsWith('- ')?`<div>• ${line.slice(2)}</div>`:`<p>${line||'<br>'}</p>`).join('').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');}
  function blueHome(state,items){return `<div class="nf-pagehead"><div><div class="nf-overline">Среда, 18 ноября</div><h1>Мои задачи</h1><p>Главное — перед глазами. Остальное подождёт.</p></div><span class="nf-date">Ноябрь 2026</span></div><div class="nf-split"><div><div class="nf-sectiontitle"><span>ПО ПОРЯДКУ СРОЧНОСТИ</span><span>${items.length}</span></div><div class="nf-queue">${items.map(t=>taskCard(t,state)).join('')}</div></div>${detail(items.find(t=>t.id===state.selected)||items[0])}</div>`;}
  function sandHome(state,items){return `<div class="nf-journalheader"><div><div class="nf-overline">Личный ежедневник</div><h1>Дела, которым<br>стоит уделить время.</h1><p class="nf-small nf-muted" style="margin-top:14px">${items.length} задач · в своём темпе</p></div><div class="nf-journaldate">18<span>Ноября · среда</span></div></div><div class="nf-inlineheading">На первом плане</div>${items.map(t=>`<article class="nf-journalrow">${check(t)}<div><button type="button" class="nf-taskname" data-action="select" data-id="${t.id}">${esc(t.title)}</button><div class="nf-meta"><span>${esc(t.due)}</span><span>·</span><span>${esc(t.estimate)}</span></div></div>${rank(t)}${state.selected===t.id?`<div class="nf-journalexpanded"><div class="nf-small nf-muted">${markdown(t.description)}</div><dl class="nf-facts"><div><dt>Создание</dt><dd>${esc(t.age.replace('Создана ',''))}</dd></div><div><dt>Запас времени</dt><dd>${esc(t.slack)}</dd></div><div><dt>Важность</dt><dd>Ранг ${esc(t.rank)}</dd></div></dl><button type="button" class="nf-action" data-action="edit" data-id="${t.id}">${icon('pencil',15)}Редактировать</button></div>`:''}</article>`).join('')}`;}
  function graphiteHome(state,items){const t=items.find(t=>t.id===state.selected)||items[0];return `<div class="nf-pagehead"><div><div class="nf-overline">Среда / 18 ноября</div><h1>Одно дело за раз.</h1><p>Понятный порядок, спокойный фокус.</p></div><span class="nf-counter">${items.length}</span></div>${t?`<section class="nf-focus"><span class="nf-tag">${icon('arrow-up-right',14)} СЕЙЧАС ВАЖНЕЕ</span><h2>${esc(t.title)}</h2><p class="nf-small nf-muted">${esc(t.age)}</p><div class="nf-focusinfo"><span>Дедлайн<strong>${esc(t.due)}</strong></span><span>На всю работу<strong>${esc(t.estimate)}</strong></span><span>Запас<strong>${esc(t.slack)}</strong></span></div><div class="nf-actions"><button type="button" class="nf-action nf-primary" data-action="complete" data-id="${t.id}">${icon('check',16)}Готово</button><button type="button" class="nf-action" data-action="edit" data-id="${t.id}">Открыть задачу ${icon('arrow-up-right',15)}</button></div></section>`:''}<div class="nf-inlineheading">Дальше по списку</div>${items.filter(x=>x!==t).map(x=>`<article class="nf-compactrow">${check(x)}<div><button type="button" class="nf-taskname" data-action="select" data-id="${x.id}">${esc(x.title)}</button><div class="nf-meta"><span>${esc(x.due)}</span><span>·</span><span>${esc(x.estimate)}</span></div></div>${rank(x)}</article>`).join('')}`;}
  function week(state){return `<div class="nf-week">${['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'].map((label,i)=>`<button type="button" class="nf-day" data-action="day" data-day="${16+i}" aria-pressed="${state.day===16+i}" aria-label="${16+i} ноября"><span>${label}</span><strong>${16+i}</strong><span>${i===2?'Сегодня':i<5?'Ноябрь':'Выходной'}</span></button>`).join('')}</div>`;}
  function plumHome(state,items){const filtered=state.wholeWeek?items:items.filter(t=>t.day===state.day);return `<div class="nf-pagehead"><div><div class="nf-overline">Ноябрь 2026</div><h1>Неделя в твоём ритме</h1><p>Все дела рядом с днём, к которому относятся.</p></div></div>${week(state)}<div class="nf-sectiontitle"><span>${state.wholeWeek?'16–22 НОЯБРЯ':state.day+' НОЯБРЯ'} · ${filtered.length} ЗАДАЧИ</span><button type="button" class="nf-action" data-action="week">${icon('arrow-right',14)}Вся неделя</button></div>${filtered.map(t=>`<div class="nf-agenda"><span class="nf-agendatime">${esc(t.due.includes('Сегодня')?t.due.split(', ')[1]:t.due==='Без дедлайна'?'Без срока':'День')}</span>${taskCard(t,state)}</div>`).join('')}${filtered.length===0?'<p class="nf-muted nf-small">На этот день задач нет. Можно выбрать другой день или всю неделю.</p>':''}${state.detailOpen?detail(items.find(t=>t.id===state.selected)):''}`;}
  function pageHeader(title,subtitle){return `<div class="nf-pagehead"><div><div class="nf-overline">Личное пространство</div><h1>${title}</h1><p>${subtitle}</p></div></div>`;}
  function formView(state){const d=state.draft;return `${pageHeader(state.editId?'Редактировать задачу':'Новое дело','Название — сейчас. Подробности — по желанию.')}<form class="nf-form" novalidate><label class="nf-field">Название задачи *<input name="title" aria-required="true" value="${esc(d.title)}" placeholder="Например, подготовить практическую" ${state.error?'aria-invalid="true" aria-describedby="'+state.key+'-error"':''}>${state.error?`<span class="nf-error" id="${state.key}-error" role="alert">Введите название — описание останется на месте.</span>`:''}</label><div class="nf-formrow"><label class="nf-field">Дедлайн<input type="date" name="date" value="${esc(d.date)}"></label><label class="nf-field">Оценка длительности<input name="estimate" value="${esc(d.estimate)}" placeholder="Например, 2 часа"></label></div><div class="nf-formrow"><label class="nf-field">Время дедлайна<input type="time" name="time" value="${esc(d.time)}"></label><label class="nf-field">Ранг важности<select name="rank">${['S','A','B','C','D'].map(r=>`<option ${r===d.rank?'selected':''}>${r}</option>`).join('')}</select></label></div><div class="nf-tabs"><button type="button" class="nf-tab" data-action="source" aria-pressed="${!state.preview}">Описание · Markdown</button><button type="button" class="nf-tab" data-action="preview" aria-pressed="${state.preview}">Просмотр</button></div>${state.preview?`<div class="nf-preview">${d.description?markdown(d.description):'<p class="nf-muted">Здесь появится описание задачи.</p>'}</div>`:`<label class="nf-field"><span class="nf-small nf-muted">Заметки, списки, важные детали</span><textarea name="description" placeholder="Что нужно сделать?">${esc(d.description)}</textarea></label>`}<div class="nf-actions"><button type="button" class="nf-action nf-primary" data-action="save">${icon('check',16)}Сохранить задачу</button><button type="button" class="nf-action" data-action="nav" data-page="tasks">К моим задачам</button></div></form>`;}
  function remindersView(state){return `${pageHeader('Напоминания','Небольшие сигналы, которые возвращают к важному.')}<article class="nf-reminder"><div><h3>Размяться и отдохнуть от экрана</h3><p>Простой сигнал · каждый час, в :00</p></div><button type="button" class="nf-action" data-action="toggle-reminder">${state.reminderOn?'Включено':'Выключено'}</button></article><article class="nf-reminder"><div><h3>Сменить постельное бельё</h3><p>С подтверждением · через 2 недели после выполнения</p></div><button type="button" class="nf-action" data-action="reminder-done">Готово</button></article><div class="nf-inlineheading">Карточка напоминания</div><div class="nf-notification"><span class="nf-tag">${icon('bell',13)} NOTIFS</span><h3>Вернуться к практической работе</h3><p>Создана 2 дня назад · дедлайн сегодня, 20:00</p><div class="nf-actions"><button type="button" class="nf-action nf-primary" data-action="notification-done">Готово</button><button type="button" class="nf-action" data-action="snooze">На 30 минут</button></div></div>`;}
  function settingsView(state){return `${pageHeader('Настройки','Приложение подстраивается под твой день.')}<div class="nf-form"><label class="nf-settingsrow"><span><strong>Запускать вместе с Windows</strong><p>Чтобы напоминания всегда были рядом.</p></span><input type="checkbox" name="autorun" ${state.autorun?'checked':''}></label><label class="nf-settingsrow"><span><strong>Периодическая сводка</strong><p>Напоминать о незавершённых задачах каждые 3 часа.</p></span><input type="checkbox" name="summary" ${state.summary?'checked':''}></label><label class="nf-field" style="margin-top:26px">Монитор уведомлений<select name="monitor"><option>Автоматически</option><option>Основной монитор</option><option>Дополнительный монитор</option></select></label><p class="nf-small nf-muted">Когда на основном мониторе открыта игра или полноэкранное видео, карточки переходят на дополнительный экран.</p></div>`;}
  function render(app,state){
    const items=state.tasks.filter(t=>!t.done);
    const nav=(page,label,symbol,extra='')=>`<button type="button" class="nf-navbutton ${page==='new'?'nf-new':''}" data-action="nav" data-page="${page}" ${state.page===page?'aria-current="page"':''}>${icon(symbol)}<span>${label}</span>${extra}</button>`;
    let content;
    if(state.page==='new')content=formView(state);
    else if(state.page==='history'){const done=state.tasks.filter(t=>t.done);content=pageHeader('История','То, что уже получилось сделать.')+(done.length?`<div class="nf-queue">${done.map(t=>taskCard(t,state)).join('')}</div>`:'<p class="nf-muted">Выполненные задачи останутся здесь. Любую можно вернуть в работу.</p>');}
    else if(state.page==='reminders')content=remindersView(state);
    else if(state.page==='settings')content=settingsView(state);
    else if(state.page==='calendar')content=pageHeader('Календарь','Выбирай день или просматривай неделю целиком.')+week(state)+`<button type="button" class="nf-action" data-action="week">${icon('arrow-right',15)}Выбрать всю неделю</button><div class="nf-inlineheading">${state.wholeWeek?'16–22 ноября':state.day+' ноября'}</div><div class="nf-queue">${items.filter(t=>state.wholeWeek||t.day===state.day).map(t=>taskCard(t,state)).join('')||'<p class="nf-muted">На этот день задач нет.</p>'}</div>`;
    else content=({blue:blueHome,sand:sandHome,graphite:graphiteHome,plum:plumHome}[state.key])(state,items);
    app.innerHTML=`<div class="nf-windowbar"><span>notifs / личное пространство</span><span class="nf-windowmarks" aria-hidden="true">${icon('minus',12)}${icon('square',11)}${icon('x',12)}</span></div><div class="nf-body"><aside class="nf-sidebar"><div><div class="nf-brand"><span class="nf-brandmark">${icon('check',21)}</span>notifs</div><small>Твои дела. Твой ритм.</small></div><nav class="nf-nav" aria-label="Разделы приложения">${nav('new','Новая задача','plus')}${nav('tasks','Мои задачи','list-todo',`<span class="nf-navcount">${items.length}</span>`)}${nav('calendar','Календарь','calendar-days')}${nav('reminders','Напоминания','bell')}${nav('history','История','history')}</nav><div class="nf-sidebarbottom">${nav('settings','Настройки','sliders-horizontal')}<div class="nf-profile"><span class="nf-avatar">${icon('user-round',16)}</span><div>Моё пространство<br><span class="nf-muted nf-small">На этом компьютере</span></div></div></div></aside><main class="nf-workspace">${content}<p class="nf-notice" role="status" aria-live="polite">${esc(state.notice)}</p><div class="nf-pagenote">${icon('hard-drive',14)}Задачи и заметки в одном месте</div></main></div>`;
    refreshIcons();
  }
  root.querySelectorAll('[data-concept]').forEach(app=>{
    const key=app.dataset.concept;
    app.setAttribute('aria-label',names[key]);
    const state={key,page:'tasks',tasks:sample.map(t=>({...t})),selected:1,day:18,wholeWeek:false,detailOpen:false,notice:'',editId:null,error:false,preview:false,reminderOn:true,summary:true,autorun:true,draft:{title:'',description:'',date:'',time:'',estimate:'',rank:'B'}};
    states.set(key,state);render(app,state);
    const draft=()=>{app.querySelectorAll('input[name],textarea[name],select[name]').forEach(field=>{if(Object.hasOwn(state.draft,field.name))state.draft[field.name]=field.value;});};
    app.addEventListener('input',()=>{if(state.page==='new')draft();});
    app.addEventListener('change',event=>{const name=event.target.name;if(['summary','autorun'].includes(name))state[name]=event.target.checked;});
    app.addEventListener('click',event=>{
      const button=event.target.closest('button[data-action]');if(!button||!app.contains(button))return;
      if(state.page==='new')draft();
      const action=button.dataset.action;if(action==='save'){saveForm();return;}const item=state.tasks.find(t=>t.id===Number(button.dataset.id));
      state.notice='';
      if(action==='nav'){state.page=button.dataset.page;if(state.page==='new'){if(state.editId){state.editId=null;state.draft={title:'',description:'',date:'',time:'',estimate:'',rank:'B'};}state.error=false;}}
      else if(action==='select'&&item){state.selected=item.id;state.detailOpen=!state.detailOpen;if(state.page==='history'){state.notice='Чтобы вернуть задачу в работу, нажмите галочку слева.';}}
      else if(action==='complete'&&item){item.done=!item.done;state.notice=item.done?'Задача выполнена. Она доступна в истории.':'Задача возвращена в работу.';if(state.selected===item.id)state.selected=state.tasks.find(t=>!t.done)?.id??null;}
      else if(action==='edit'&&item){state.editId=item.id;state.draft={title:item.title,description:item.description,estimate:item.estimate==='Без оценки'?'':item.estimate,rank:item.rank,date:item.due.startsWith('Сегодня')?'2026-11-18':'',time:item.due.startsWith('Сегодня')?item.due.split(', ')[1]:''};state.page='new';state.preview=false;state.error=false;}
      else if(action==='preview')state.preview=true;
      else if(action==='source')state.preview=false;
      else if(action==='day'){state.day=Number(button.dataset.day);state.wholeWeek=false;}
      else if(action==='week')state.wholeWeek=true;
      else if(action==='toggle-reminder')state.reminderOn=!state.reminderOn;
      else if(action==='reminder-done')state.notice='Выполнено. Следующее дело — через две недели.';
      else if(action==='notification-done'){state.tasks.find(t=>t.id===1).done=true;state.notice='Практическая отмечена выполненной.';}
      else if(action==='snooze')state.notice='Напомнить через 30 минут.';
      render(app,state);
      if(action==='nav'&&state.page==='new')app.querySelector('input[name="title"]')?.focus({preventScroll:true});
    });
    function saveForm(){
      draft();
      if(!state.draft.title.trim()){state.error=true;render(app,state);app.querySelector('input[name="title"]').focus({preventScroll:true});return;}
      const existing=state.tasks.find(t=>t.id===state.editId);
      const data={id:existing?.id??Math.max(0,...state.tasks.map(t=>t.id))+1,title:state.draft.title.trim(),description:state.draft.description,rank:state.draft.rank,due:state.draft.date?(state.draft.date==='2026-11-18'?'Сегодня':state.draft.date.split('-').reverse().join('.'))+(state.draft.time?', '+state.draft.time:''):'Без дедлайна',estimate:state.draft.estimate||'Без оценки',age:existing?.age??'Создана только что',slack:'—',day:state.draft.date?Number(state.draft.date.slice(-2)):18,done:existing?.done??false};
      if(existing)Object.assign(existing,data);else state.tasks.push(data);
      state.selected=data.id;state.page=data.done?'history':'tasks';state.notice=existing?'Изменения сохранены.':'Новая задача добавлена.';state.editId=null;state.error=false;state.draft={title:'',description:'',date:'',time:'',estimate:'',rank:'B'};render(app,state);
    }
    app.addEventListener('submit',event=>{event.preventDefault();saveForm();});
    app.addEventListener('keydown',event=>{if(state.page==='new'&&((event.ctrlKey&&event.key.toLowerCase()==='s')||(event.key==='Enter'&&event.target.tagName==='INPUT'))){event.preventDefault();saveForm();}});
    if(globalThis.Tweak){
      const options={accent:getComputedStyle(app).getPropertyValue('--nf-accent').trim(),radius:parseInt(getComputedStyle(app).getPropertyValue('--nf-round'))};
      const tweak=new globalThis.Tweak({container:app,onChange:()=>{app.style.setProperty('--nf-accent',options.accent);app.style.setProperty('--nf-round',options.radius+'px');}});
      tweak.addColorPicker(options,'accent',{label:'Акцент',reference:'--nf-accent'});tweak.addSlider(options,'radius',{label:'Скругления',min:4,max:24,unit:'px'});
    }
  });
})();
</script>
